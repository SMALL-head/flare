syntax = "proto3";

package proto;

option go_package = "./;proto";

message getMalCTIDRequest {
  string node = 1; 
  uint32 pid = 2;
  uint64 timestp = 3;
}

message getMalCTIDReply {
  string syscall = 1;
  repeated uint64 ctids = 2;
  string message = 3;
}

service KernelTraceService {
    rpc getMalCTID (getMalCTIDRequest) returns (getMalCTIDReply);
}